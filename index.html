<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac & AI 学習ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#f0ede8;--text2:#a8a49e;--text3:#6b6863;
  --accent:#e8c547;--accent2:#c4a030;
  --green:#4caf82;--blue:#5b9cf6;--coral:#f07060;
  --font:'Noto Sans JP',sans-serif;--mono:'Space Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:0}
.app{max-width:900px;margin:0 auto;padding:1.5rem 1rem}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-title{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--text2);text-transform:uppercase;font-family:var(--mono)}
.logo-sub{font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.date-badge{font-family:var(--mono);font-size:12px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 12px;text-align:right}
.date-badge .day{font-size:20px;font-weight:700;color:var(--text2);display:block}
.today-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
.today-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--green))}
.lesson-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.lesson-num{font-family:var(--mono);font-size:11px;color:var(--accent);background:rgba(232,197,71,0.12);border:1px solid rgba(232,197,71,0.25);border-radius:4px;padding:3px 8px;letter-spacing:.05em}
.lesson-tag{font-size:11px;color:var(--text3);background:var(--bg4);border-radius:4px;padding:3px 8px}
.lesson-title{font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:.6rem;line-height:1.35}
.lesson-body{font-size:.95rem;color:var(--text2);line-height:1.8;margin-bottom:1.2rem}
.tips-box{background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:1rem;margin-bottom:1rem}
.tips-label{font-family:var(--mono);font-size:11px;color:var(--green);margin-bottom:.6rem;letter-spacing:.05em}
.tip-item{display:flex;gap:8px;font-size:.88rem;color:var(--text2);margin-bottom:.4rem;align-items:flex-start}
.tip-bullet{color:var(--accent);flex-shrink:0;margin-top:2px}
.shortcut-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:.5rem}
.kbd{background:var(--bg3);border:1px solid var(--border2);border-bottom-width:3px;border-radius:5px;padding:3px 8px;font-family:var(--mono);font-size:11px;color:var(--text2)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center}
.stat-num{font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--text);display:block}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.progress-bar{height:4px;background:var(--bg4);border-radius:2px;margin-top:.6rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px}
.section-title{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.8rem}
.archive-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-size:12px;padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:var(--font)}
.tab.active{border-color:var(--accent);color:var(--accent);background:rgba(232,197,71,.08)}
.archive-list{display:flex;flex-direction:column;gap:6px}
.archive-item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;cursor:pointer}
.archive-item.expanded{border-color:var(--accent2)}
.arc-day{font-family:var(--mono);font-size:11px;color:var(--text3);min-width:38px}
.arc-tag{font-size:10px;padding:2px 7px;border-radius:3px;font-family:var(--mono)}
.arc-tag.trackpad{background:rgba(91,156,246,.12);color:var(--blue);border:1px solid rgba(91,156,246,.2)}
.arc-tag.spotlight{background:rgba(76,175,130,.12);color:var(--green);border:1px solid rgba(76,175,130,.2)}
.arc-tag.dock{background:rgba(232,197,71,.12);color:var(--accent);border:1px solid rgba(232,197,71,.2)}
.arc-tag.ai{background:rgba(240,112,96,.12);color:var(--coral);border:1px solid rgba(240,112,96,.2)}
.arc-tag.finder{background:rgba(160,130,200,.12);color:#b09fe0;border:1px solid rgba(160,130,200,.2)}
.arc-title{font-size:.88rem;color:var(--text2);flex:1}
.arc-expand{font-size:14px;color:var(--text3)}
.arc-body{font-size:.85rem;color:var(--text3);line-height:1.7;padding:.75rem 1rem .75rem 62px;border-top:1px solid var(--border);display:none}
.archive-item.expanded + .arc-body{display:block}
footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);font-size:11px;color:var(--text3);font-family:var(--mono);text-align:center;letter-spacing:.05em}
@media(max-width:600px){
  .lesson-title{font-size:1.15rem}
  .header{flex-direction:column}
  .filter-tabs{gap:4px}
}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2C10 2 7 5 7 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0-1-.4-2-1-2.8" stroke="#0d0d0d" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="10" cy="15" r="1.5" fill="#0d0d0d"/>
        <path d="M4 17h12" stroke="#0d0d0d" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="logo-title">Daily Learning</div>
      <div class="logo-sub">Mac & AI 学習ダッシュボード</div>
    </div>
  </div>
  <div class="date-badge">
    <span class="day" id="dayNum">—</span>
    <span id="dateStr">読み込み中...</span>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card">
    <span class="stat-num" id="statDay">0</span>
    <div class="stat-label">今日のレッスン</div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  </div>
  <div class="stat-card">
    <span class="stat-num" id="statDone">0</span>
    <div class="stat-label">完了済み</div>
    <div class="progress-bar"><div class="progress-fill" id="prog2" style="width:0%;background:var(--green)"></div></div>
  </div>
  <div class="stat-card">
    <span class="stat-num">30</span>
    <div class="stat-label">総レッスン数</div>
    <div class="progress-bar"><div class="progress-fill" style="width:100%;background:var(--border2)"></div></div>
  </div>
</div>

<div class="today-card" id="todayCard">
  <div class="lesson-header">
    <span class="lesson-num" id="lessonNum">DAY 01</span>
    <span class="lesson-tag" id="lessonTag">読み込み中</span>
  </div>
  <div class="lesson-title" id="lessonTitle">読み込み中...</div>
  <div class="lesson-body" id="lessonBody"></div>
  <div class="tips-box">
    <div class="tips-label">▸ PRACTICE TIPS</div>
    <div id="tipsList"></div>
    <div id="shortcutsArea"></div>
  </div>
</div>

<div class="archive-header">
  <div class="section-title">アーカイブ</div>
  <div class="filter-tabs">
    <button class="tab active" onclick="filterArchive('all',this)">すべて</button>
    <button class="tab" onclick="filterArchive('trackpad',this)">トラックパッド</button>
    <button class="tab" onclick="filterArchive('spotlight',this)">Spotlight</button>
    <button class="tab" onclick="filterArchive('ai',this)">AI活用</button>
    <button class="tab" onclick="filterArchive('finder',this)">Finder</button>
    <button class="tab" onclick="filterArchive('dock',this)">Dock</button>
  </div>
</div>
<div class="archive-list" id="archiveList"></div>

<footer>朝 5:00 に翌日のレッスンが解放されます　｜　MacBook Air 2026 対応</footer>
</div>

<script>

// ▼ ここから下は動作ロジック（変更不要）
// =============================================

function getJST() {
  const now = new Date();
  return new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
}

function getTodayLesson() {
  const jst = getJST();
  const msPerDay = 86400000;
  const diff = Math.floor((jst - START_DATE) / msPerDay);
  const idx = Math.min(Math.max(diff, 0), LESSONS.length - 1);
  return { lesson: LESSONS[idx], idx };
}

function getAvailableCount() {
  const jst = getJST();
  const nowHour = jst.getHours();
  let daysPassed = Math.floor((jst - START_DATE) / 86400000);
  if (nowHour < 5) daysPassed -= 1;
  return Math.min(Math.max(daysPassed + 1, 1), LESSONS.length);
}

function tagLabel(t) {
  const map = { trackpad: 'トラックパッド', spotlight: 'Spotlight', dock: 'Dock・UI', ai: 'AI活用', finder: 'Finder' };
  return map[t] || t;
}

function renderToday() {
  const jst = getJST();
  const days = ['日', '月', '火', '水', '木', '金', '土'];
  document.getElementById('dayNum').textContent = jst.getDate();
  document.getElementById('dateStr').textContent =
    jst.getFullYear() + '/' + String(jst.getMonth() + 1).padStart(2, '0') + '/' + String(jst.getDate()).padStart(2, '0') + ' (' + days[jst.getDay()] + ')';

  const { lesson } = getTodayLesson();
  const available = getAvailableCount();

  document.getElementById('statDay').textContent = lesson.day;
  document.getElementById('statDone').textContent = available;
  document.getElementById('prog').style.width = Math.round(lesson.day / 30 * 100) + '%';
  document.getElementById('prog2').style.width = Math.round(available / 30 * 100) + '%';

  document.getElementById('lessonNum').textContent = 'DAY ' + String(lesson.day).padStart(2, '0');
  document.getElementById('lessonTag').textContent = tagLabel(lesson.tag);
  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonBody').textContent = lesson.body;

  const tipsList = document.getElementById('tipsList');
  tipsList.innerHTML = lesson.tips.map(t =>
    '<div class="tip-item"><span class="tip-bullet">▸</span><span>' + t + '</span></div>'
  ).join('');

  const sArea = document.getElementById('shortcutsArea');
  if (lesson.shortcuts && lesson.shortcuts.length) {
    sArea.innerHTML = '<div class="shortcut-row" style="margin-top:.6rem;align-items:center;font-size:11px;color:var(--text3)">ショートカット：' +
      lesson.shortcuts.map(k => '<span class="kbd">' + k + '</span>').join('<span style="color:var(--text3);font-size:10px;margin:0 2px">+</span>') + '</div>';
  } else {
    sArea.innerHTML = '';
  }
}

let currentFilter = 'all';

function filterArchive(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderArchive();
}

function renderArchive() {
  const available = getAvailableCount();
  const todayDay = getTodayLesson().lesson.day;
  const list = document.getElementById('archiveList');
  const filtered = LESSONS.filter(l => currentFilter === 'all' || l.tag === currentFilter);

  let html = '';
  filtered.forEach(l => {
    if (l.day === todayDay) return;
    const unlocked = l.day < available;
    html += '<div class="archive-item" id="item-' + l.day + '" onclick="toggleItem(' + l.day + ',' + unlocked + ')">'
      + '<span class="arc-day">Day ' + String(l.day).padStart(2, '0') + '</span>'
      + '<span class="arc-tag ' + l.tag + '">' + tagLabel(l.tag) + '</span>'
      + '<span class="arc-title">' + l.title + '</span>'
      + '<span class="arc-expand">' + (unlocked ? '∨' : '🔒') + '</span>'
      + '</div>'
      + '<div class="arc-body" id="body-' + l.day + '">'
      + (unlocked
        ? l.body + '<div style="margin-top:.5rem;font-size:.82rem;color:var(--text3)">' + l.tips.map(t => '▸ ' + t).join('<br>') + '</div>'
        : '<span style="font-style:italic">🔒 このレッスンはまだ解放されていません（朝5時に解放）</span>')
      + '</div>';
  });

  list.innerHTML = html || '<div style="color:var(--text3);font-size:.88rem;text-align:center;padding:1rem">このカテゴリのアーカイブはありません</div>';
}

function toggleItem(day, unlocked) {
  const item = document.getElementById('item-' + day);
  const body = document.getElementById('body-' + day);
  const isExp = item.classList.contains('expanded');

  document.querySelectorAll('.archive-item.expanded').forEach(el => {
    el.classList.remove('expanded');
    const b = document.getElementById('body-' + el.id.replace('item-', ''));
    if (b) b.style.display = 'none';
  });

  if (!isExp) {
    item.classList.add('expanded');
    body.style.display = 'block';
  }
}

renderToday();
renderArchive();
